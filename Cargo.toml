[package]
name = "freegal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal client for Freegal Music (personal use, library-card streaming + downloads)"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
tui-input = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.24"
toml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
unicode-width = "0.2"
tokio-stream = "0.1"

[dev-dependencies]
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
